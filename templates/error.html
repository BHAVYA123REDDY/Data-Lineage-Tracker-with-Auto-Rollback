<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ code }} &mdash; Data Lineage Tracker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>Data Lineage Tracker with Auto Rollback</h1>
    <p class="subtitle">Error {{ code }}</p>
  </header>

  <main>
    <section class="panel error-panel">
      <p class="error-code">{{ code }}</p>
      <h2>{{ message }}</h2>
      <p class="small">The page you asked for could not be shown.</p>
      <div class="controls">
        <a class="btn" href="{{ url_for('index') }}">Back to dashboard</a>
        <a class="btn" href="{{ url_for('logs_page') }}">View logs</a>
      </div>
    </section>
  </main>

  <footer>
    <p>Phase 5: Dashboard, logs and error handling</p>
  </footer>
</body>
</html>
