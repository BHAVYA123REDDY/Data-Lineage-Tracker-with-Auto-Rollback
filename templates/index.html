<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Lineage Tracker with Auto Rollback</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>Data Lineage Tracker with Auto Rollback</h1>
    <p class="subtitle">DevOps PBL &mdash; Dashboard</p>
  </header>

  <main>
    <section class="card">
      <h2>Pipeline Status</h2>
      <p class="status ok">Coming in Phase 3</p>
    </section>

    <section class="card">
      <h2>Data Lineage</h2>
      <p class="status pending">Coming in Phase 3</p>
    </section>

    <section class="card">
      <h2>Version History</h2>
      <p class="status pending">Coming in Phase 2</p>
    </section>

    <section class="card">
      <h2>Rollback History</h2>
      <p class="status pending">Coming in Phase 4</p>
    </section>
  </main>

  <footer>
    <p>Phase 1: Minimal Flask website</p>
  </footer>
</body>
</html>
