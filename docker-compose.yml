# ---------------------------------------------------------------------------
# Data Lineage Tracker with Auto Rollback - Docker Compose
#
#   docker compose up -d --build     start in the background
#   docker compose logs -f           follow the logs
#   docker compose down              stop (data stays in the volume)
#   docker compose down -v           stop and delete the database volume
#
# Usage is optional: `docker build` + `docker run` work just as well.
# ---------------------------------------------------------------------------
services:
  lineage-tracker:
    build: .
    image: data-lineage-tracker:1.0
    container_name: lineage-tracker
    ports:
      - "5000:5000"
    environment:
      HOST: 0.0.0.0
      PORT: "5000"
      LINEAGE_DB_PATH: /app/data/lineage.db
      # Set to "false" to see failures WITHOUT automatic rollback.
      AUTO_ROLLBACK_ENABLED: "true"
    volumes:
      # The database lives here, so it survives container restarts.
      - lineage-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  lineage-data:
